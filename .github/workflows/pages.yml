# Publica o TibiaVault no GitHub Pages (tibia.baverone.com).
# Substitui o Vercel desde 24/09/2026 (decisão do André: tudo no GitHub).
#
# Só faz build quando o CÓDIGO muda. Os dados (XP e hunts) não passam por
# aqui: a app lê-os em directo do raw.githubusercontent.com (src/config.ts),
# por isso os commits diários de XP não precisam de novo deploy.
name: pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/celesta-hunts.json'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# false (11/11/2026): é o que o GitHub recomenda para o Pages — um push novo
# espera que o deploy em curso acabe, em vez de o cortar a meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 12/11/2026 (proposta 1 da auditoria, aprovada pelo André): os testes, o
      # lint e os tipos travam o deploy. Até aqui corriam à parte (testes.yml),
      # e uma regressão nas contas que compilasse chegava ao site na mesma. O
      # testes.yml passou em Linux a 11/11 e saiu: era o mesmo trabalho duas vezes.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
