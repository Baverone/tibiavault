# Alarme de frescura da XP -- so le, nunca escreve no repositorio.
#
# 28/10/2026 (decisao do Andre: cortar o que e redundante): este workflow
# deixou de tentar a recolha e de fazer commit/push. A recolha e do PC
# (tarefas tibia-xp e tibia-xp-chrome do ai-pc) e a unica porta de saida para
# o GitHub e o tibia-push; um segundo bot a escrever data/scraped-history era
# uma segunda porta, e nao entrava nada por aqui desde 21/08. O nome do
# ficheiro ficou o mesmo para nao partir links e o historico das corridas.
#
# O que fica e o alarme, e e por isso que isto continua no GitHub e nao no PC:
# check-history-freshness.mjs falha a VERMELHO se ha 3+ dias que nao entra XP
# nova. Apanha o PC desligado, o runner parado ou a tarefa apagada -- coisas
# que o proprio PC nao consegue avisar sobre si.
#
# Historia: entre 21 e 31/08/2026 a recolha aqui ficou verde todos os dias sem
# recolher um unico dia (403 do guildstats tratado como transitorio). Foi dai
# que nasceu o alarme: nao "o pedido correu bem?", mas "ha quantos dias e que
# nao entra XP nova?".
name: Scrape Tibia Experience

on:
  # Uma vez por dia, as 12:00 UTC. O cron do GitHub costuma atrasar-se horas,
  # o que aqui nao faz diferenca: a verificacao tem 3 dias de folga.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  frescura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # o guildstatsHistory.mjs que o alarme importa precisa do cheerio
      - run: npm ci

      - name: Historico esta a ficar para tras?
        run: node scripts/check-history-freshness.mjs
