# Corre os testes, os tipos e o lint em cada push de código para o main
# (auditoria de 11/11/2026, com o Codex: o pages.yml só fazia build, e uma
# regressão nas contas que compilasse ia direta para o site).
#
# Fica à parte do pages.yml de propósito, por agora: os testes nunca correram
# em Linux (o PC é Windows), e pô-los a travar o deploy sem os ver passar lá
# primeiro arriscava parar o site por um teste dependente do Windows. Quando
# este workflow estiver verde umas semanas, o passo `npm test` pode passar para
# o job de build do pages.yml.
name: testes

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'public/celesta-hunts.json'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm test
