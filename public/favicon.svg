<!-- O logótipo do tibiavault: o mesmo quadrado com a inicial que está no topo da
     barra lateral (ver `.marca .mk` em src/styles/shell.css), na cor do
     projeto. O que estava aqui era o raio roxo que vem por omissão no
     esqueleto do Vite — o separador do browser dizia "Vite". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38d39f"/>
      <stop offset="1" stop-color="#1d9c73"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" fill="url(#v)"/>
  <path d="M13 15.5h22M24 15.5V34" stroke="#04130e" stroke-width="5.4"
        stroke-linecap="round" fill="none"/>
</svg>
